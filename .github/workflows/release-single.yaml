name: 发布单设备 OTA

on:
  # push/PR 不会真正发布，只构建检查是否有明显失败
  push:
    branches:
      - '*'
    paths:
      - rooted-ota.sh
  pull_request:
    types: [synchronize, opened, reopened]
    paths:
      - rooted-ota.sh

  workflow_call:
    inputs:
      device-id:
        type: string
      magisk-preinit-device:
        type: string
        default: ''
      ksu-version:
        type: string
        default: ''
      ksu-kmi:
        type: string
        default: ''
  
  # 允许从 Actions 标签页手动触发
  workflow_dispatch:
    inputs:
      device-id:
        description: 设备 ID
        required: true
      magisk-preinit-device:
        description: Magisk preinit 设备分区
        required: false
      ksu-version:
        description: KernelSU 版本（例如 'v3.2.4'）
        required: false
      ksu-kmi:
        description: KernelSU KMI（留空则自动检测）
        required: false
      skip-rootless:
        description: 跳过构建 rootless OTA
        type: boolean
        required: false
      skip-rooted:
        description: 跳过构建 rooted OTA
        type: boolean
        required: false
      upload-test-ota:
        description: 将 OTA 上传到 test 目录
        required: false
        type: boolean
      force-build:
        description: 强制构建并上传产物到 release（即使已存在）
        required: false
        type: boolean
      force-ota-server-upload:
        description: 强制上传到 OTA 服务器
        required: false
        type: boolean
      skip-release:
        description: 跳过发布（仅构建）
        required: false
        type: boolean
      ota-version:
        description: OTA 版本
        required: false
      magisk-version:
        description: Magisk 版本
        required: false
jobs:
  build-device:
    runs-on: [self-hosted, linux, x64, docker]
    timeout-minutes: 20 # 避免某个命令卡住时浪费数小时
    steps:
      - uses: actions/checkout@v6
        with:
          # 允许切换到 gh-pages 分支
          fetch-depth: 0
      - name: 设置输入参数
        # 空值表示使用 rooted-ota.sh 中定义的默认版本
        # 注意 github.event.inputs（workflow_dispatch）和 inputs（workflow_call）的区别
        run: |
          echo "DEVICE_ID=$(echo '${{ github.event.inputs.device-id || inputs.device-id || 'shiba' }}' | xargs)" >> $GITHUB_ENV
          if [[ "${{ github.event.inputs.skip-rooted }}" != "true" ]]; then
            echo "MAGISK_PREINIT_DEVICE=$(echo '${{ github.event.inputs.magisk-preinit-device || inputs.magisk-preinit-device || 'sda10' }}' | xargs)" >> $GITHUB_ENV
          fi
          
          echo "MAGISK_VERSION=$(echo '${{ github.event.inputs.magisk-version || '' }}' | xargs)" >> $GITHUB_ENV
          echo "OTA_VERSION=$(echo '${{ github.event.inputs.ota-version || '' }}' | xargs)" >> $GITHUB_ENV
          echo "FORCE_OTA_SERVER_UPLOAD=$(echo '${{ github.event.inputs.force-ota-server-upload || '' }}' | xargs)" >> $GITHUB_ENV
          echo "FORCE_BUILD=$(echo '${{ github.event.inputs.force-build || '' }}' | xargs)" >> $GITHUB_ENV
          echo "UPLOAD_TEST_OTA=$(echo '${{ github.event.inputs.upload-test-ota || '' }}' | xargs)" >> $GITHUB_ENV
          echo "SKIP_ROOTLESS=$(echo '${{ github.event.inputs.skip-rootless || '' }}' | xargs)" >> $GITHUB_ENV
          echo "SKIP_RELEASE=$(echo '${{ github.event.inputs.skip-release || '' }}' | xargs)" >> $GITHUB_ENV
          echo "KSU_VERSION=$(echo '${{ github.event.inputs.ksu-version || inputs.ksu-version || '' }}' | xargs)" >> $GITHUB_ENV
          echo "KSU_KMI=$(echo '${{ github.event.inputs.ksu-kmi || inputs.ksu-kmi || '' }}' | xargs)" >> $GITHUB_ENV
          
          if [[ "${{ github.event_name }}" == "push" ]]  || [[ "${{ github.event_name }}" == "pull_request" ]]; then
            echo "在 push 上运行：仅构建不发布，设备 $DEVICE_ID"
            echo "FORCE_BUILD=true" >> $GITHUB_ENV
            echo "SKIP_RELEASE=true" >> $GITHUB_ENV
            echo "GITHUB_TOKEN=must-be-set-but-is-not-used" >> $GITHUB_ENV
          else
            echo "GITHUB_TOKEN=${{ secrets.GITHUB_TOKEN }}" >> $GITHUB_ENV
          fi
      - run: sudo apt-get install -y jq curl git
      - name: 发布
        env:
          GITHUB_REPO: ${{ github.repository }}
          # 从 vars 加载签名密钥，从 secrets 加载密码
          # PR/push 的开发构建使用随机 dev key 可忽略密码
          KEY_AVB_BASE64: ${{ vars.KEY_AVB_BASE64 }}
          CERT_OTA_BASE64: ${{ vars.CERT_OTA_BASE64 }}
          KEY_OTA_BASE64: ${{ vars.KEY_OTA_BASE64 }}
          # 生产构建时从 secrets 加载密码（PR/push 的开发构建用无密码的 dev key，不需要密码）
          PASSPHRASE_AVB: ${{ secrets.PASSPHRASE_AVB }}
          PASSPHRASE_OTA: ${{ secrets.PASSPHRASE_OTA }}
        run: |
          if [[ $SKIP_RELEASE == 'true' ]]; then
            DEBUG=1 bash -c '. rooted-ota.sh && createRootedOta && createOtaServerData'
          else
            DEBUG=1 bash -c '. rooted-ota.sh && createAndReleaseRootedOta'
          fi
