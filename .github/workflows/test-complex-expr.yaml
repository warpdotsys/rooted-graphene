name: 测试 - 复杂表达式

on:
  workflow_call:
    inputs:
      device-id:
        type: string
      magisk-preinit-device:
        type: string
        default: ''
      ksu-version:
        type: string
        default: ''
      ksu-kmi:
        type: string
        default: ''
  workflow_dispatch:
    inputs:
      device-id:
        description: 设备 ID
        required: true
      magisk-preinit-device:
        description: Magisk preinit
        required: false
      ksu-version:
        description: KernelSU version
        required: false
        default: 'latest'
      ksu-kmi:
        description: KMI
        required: false

jobs:
  build-device:
    runs-on: [self-hosted, linux, x64]
    timeout-minutes: 45
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: 设置输入参数
        run: |
          echo "DEVICE_ID=$(echo '${{ github.event.inputs.device-id || inputs.device-id || 'shiba' }}' | xargs)" >> $GITHUB_ENV
          RAW_MAGISK='${{ github.event.inputs.magisk-preinit-device || inputs.magisk-preinit-device }}'
          [ -z "$RAW_MAGISK" ] && RAW_MAGISK=''
          echo "MAGISK_PREINIT_DEVICE=$RAW_MAGISK" >> $GITHUB_ENV
          echo "KSU_VERSION=$(echo '${{ github.event.inputs.ksu-version || inputs.ksu-version || '' }}' | xargs)" >> $GITHUB_ENV
          echo "KSU_KMI=$(echo '${{ github.event.inputs.ksu-kmi || inputs.ksu-kmi || '' }}' | xargs)" >> $GITHUB_ENV
          echo done
